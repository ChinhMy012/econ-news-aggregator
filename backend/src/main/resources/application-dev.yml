spring:
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:econnews}}
    username: ${DB_USERNAME:${POSTGRES_USER:econnews}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
