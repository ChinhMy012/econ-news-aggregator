spring:
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:econnews}}
    username: ${DB_USERNAME:${POSTGRES_USER:econnews}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  jwt:
    issuer: econnews
    audience: econnews-api
    key-id: local-rsa-1
    access-token-ttl: 15m
    private-key: ${JWT_PRIVATE_KEY_PATH}
    public-key: ${JWT_PUBLIC_KEY_PATH}
  auth:
    # Chỉ localhost HTTP được phép không dùng Secure; môi trường thật mặc định true.
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
