services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Missing POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Missing POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles: [app]
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_PRIVATE_KEY_PATH: file:/run/keys/private-key.pem
      JWT_PUBLIC_KEY_PATH: file:/run/keys/public-key.pem
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      APP_COLLECTION_SCHEDULE_CRON: ${APP_COLLECTION_SCHEDULE_CRON:--}
      APP_COLLECTION_SCHEDULE_INTERVAL: ${APP_COLLECTION_SCHEDULE_INTERVAL:-30m}
      APP_COLLECTION_SCHEDULE_BATCH_SIZE: ${APP_COLLECTION_SCHEDULE_BATCH_SIZE:-5}
    volumes:
      - type: bind
        source: ${JWT_KEYS_DIR:-./.secrets/jwt}
        target: /run/keys
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    profiles: [app]
    build: ./frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data: